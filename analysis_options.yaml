##################################################################################
##                      모든 패키지에 대한 린터 규칙                                 ##
##                      -----------------------------                           ##
## 패키지마다 별도의 analysis-options.yaml 파일을 정의할 필요가 없습니다.               ##
## 해당 파일이 패키지에서 찾을 수 없으면 자동으로 상위 디렉토리로 이동합니다.                ##
## https://dart.dev/guides/language/analysis-options#the-analysis-options-file  ##
##################################################################################

include: package:very_good_analysis/analysis_options.yaml

linter:
  rules:
    no_default_cases: true
    # 문서화 규칙 비활성화 (개발 중에는 불필요)
    public_member_api_docs: false
    # import 순서 규칙 완화
    directives_ordering: false
    # package import 강제 비활성화
    always_use_package_imports: false
    # 불필요한 중복 값 경고 비활성화
    avoid_redundant_argument_values: false
    # 생성자 순서 경고 비활성화
    sort_constructors_first: false
    # 의존성 정렬 경고 비활성화
    sort_pub_dependencies: false
    # 매개변수 순서 경고 비활성화
    always_put_required_named_parameters_first: false
    # int 리터럴 선호 비활성화
    prefer_int_literals: false
    # 80자 제한 비활성화
    lines_longer_than_80_chars: false
    # 불필요한 null 체크 경고 비활성화
    unnecessary_null_checks: false
    # cascade 사용 권장 비활성화
    cascade_invocations: false
    # 로컬 변수 타입 생략 권장 비활성화
    omit_local_variable_types: false
    # 불필요한 람다 경고 비활성화
    unnecessary_lambdas: false
    # ColoredBox 사용 권장 비활성화
    use_colored_box: false
    # awaited futures 경고 비활성화
    unawaited_futures: false
    # bool 파라미터 위치 경고 비활성화
    avoid_positional_boolean_parameters: false
    # const 사용 권장 비활성화
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    # return 인라인 권장 비활성화
    join_return_with_assignment: false
    # if-null 연산자 사용 권장 비활성화
    use_if_null_to_convert_nulls_to_bools: false

##
# 개발자 API가 없는 앱 (예: 명령 줄 도구 및 플러터 애플리케이션)에 사용할 린트 규칙입니다.
##

analyzer:
  errors:
    discarded_futures: ignore
    # 타입 추론 실패 경고 비활성화
    inference_failure_on_instance_creation: ignore
    inference_failure_on_function_return_type: ignore
    inference_failure_on_function_invocation: ignore
    # 인자 타입 불일치 오류 경고로 변경
    argument_type_not_assignable: ignore

  # 자동 생성된 파일을 Dart 분석에서 제외합니다.
  exclude:
    - '**/**.freezed.dart'
    - '**/**.config.dart'
    - '**/**.module.dart'
    - '**/**.mock.dart'
    - '**/**.gr.dart'
    - '**/**.gm.dart'
    - '**/**.freezed.dart'
    - '**/**.g.dart'
    - '**/**._test.dart'
    - '**/injector.module.dart'
